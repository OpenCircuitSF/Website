<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0A0D0B" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F4F6F3" media="(prefers-color-scheme: light)" />
    <title>%%OC_TITLE%%</title>
    <!-- Per-route social preview tags. These %%OC_*%% tokens are placeholder
         markers, not real content -- internal/seo (#0019) loads this built
         file into memory at startup and substitutes them per request path
         before serving, since social crawlers (Discord, Slack, iMessage, X,
         Facebook, LinkedIn) fetch the raw HTML and never execute the SPA
         bundle, so the values need to already be correct in the markup they
         receive. Every substituted value is HTML-escaped by the injector. If
         you're seeing the raw, unsubstituted title placeholder in a browser
         tab, you're looking at `vite`/`vite preview` output directly (dev mode) rather
         than through the Go server that performs the substitution -- use
         `./scripts/dev.sh --built` to see the real injected values. -->
    <meta name="description" content="%%OC_DESCRIPTION%%" />
    <meta property="og:title" content="%%OC_OG_TITLE%%" />
    <meta property="og:description" content="%%OC_OG_DESCRIPTION%%" />
    <meta property="og:image" content="%%OC_OG_IMAGE%%" />
    <meta property="og:url" content="%%OC_OG_URL%%" />
    <meta property="og:type" content="%%OC_OG_TYPE%%" />
    <meta name="twitter:card" content="%%OC_TWITTER_CARD%%" />
    <!-- schema.org Event structured data for a workshop detail page (#0055,
         PRD §7.4). The JSON-LD placeholder token below is substituted with
         either a whole `<script type="application/ld+json">...</script>` block (built
         server-side by internal/seo/jsonld.go) or an empty string for every
         route that isn't a workshop with enough data for a spec-valid Event
         (name/startDate/location -- see that file's doc comments for exactly
         which workshops qualify). Unlike the %%OC_OG_*%% tokens above, this
         value is NOT run through html.EscapeString -- it is already a
         complete, self-contained JSON document produced by
         encoding/json.Marshal, which HTML-escapes <, >, and & by default, so
         embedding it verbatim inside <script> is safe and re-escaping it as
         HTML text would corrupt the JSON. -->
    %%OC_JSONLD%%
    <!-- SVG favicon first (currentColor-free, self-switches light/dark via its
         own internal prefers-color-scheme, so it works before app.css loads);
         favicon-32.png is the raster fallback for browsers that don't support
         SVG favicons. The ?v= is a cache-buster: browsers cache favicons very
         aggressively and will otherwise keep painting a previously-cached icon
         (e.g. ShortLinks' old white-line one, replaced in #0018). Bump on
         change. See docs/frontend.md for the file:// mask restriction that
         affects the header logo (not these <link> icons, which are plain
         <img>-equivalent references and work under file:// too). -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=1" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=4" />
    <link rel="manifest" href="/site.webmanifest" />
    <script>
      // Applied before first paint so the correct theme is never repainted.
      // Cycles auto -> light -> dark (theme-toggle script, #0011); "auto"
      // removes the attribute entirely rather than pinning the current OS
      // value, so prefers-color-scheme keeps driving the page.
      try {
        var t = localStorage.getItem('theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
