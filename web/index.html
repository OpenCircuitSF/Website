<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0A0D0B" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F4F6F3" media="(prefers-color-scheme: light)" />
    <title>%%OC_TITLE%%</title>
    <meta name="description" content="%%OC_DESCRIPTION%%" />
    <meta property="og:title" content="%%OC_OG_TITLE%%" />
    <meta property="og:description" content="%%OC_OG_DESCRIPTION%%" />
    <meta property="og:image" content="%%OC_OG_IMAGE%%" />
    <meta property="og:url" content="%%OC_OG_URL%%" />
    <meta property="og:type" content="%%OC_OG_TYPE%%" />
    <meta property="og:site_name" content="Open Circuit SF" />
    <meta name="twitter:card" content="%%OC_TWITTER_CARD%%" />
    <meta name="twitter:title" content="%%OC_TWITTER_TITLE%%" />
    <meta name="twitter:description" content="%%OC_TWITTER_DESCRIPTION%%" />
    %%OC_CANONICAL%%
    %%OC_JSONLD%%
    <link rel="alternate" type="application/atom+xml" title="Open Circuit SF newsletter" href="/archive/feed.xml" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=1" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=4" />
    <link rel="manifest" href="/site.webmanifest" />
    <script>
      // Applied before first paint so the correct theme is never repainted.
      // Cycles auto -> light -> dark (theme-toggle script, #0011); "auto"
      // removes the attribute entirely rather than pinning the current OS
      // value, so prefers-color-scheme keeps driving the page.
      try {
        var t = localStorage.getItem('theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app">%%OC_BODY%%</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
