<VirtualHost *:443>
    # www is the canonical host; the apex is only an alias so this vhost can
    # also terminate TLS for it long enough to issue the redirect below.
    # PRD §10.2 / CLAUDE.md §7: www stays canonical, apex redirects to it.
    ServerName www.opencircuitsf.com
    ServerAlias opencircuitsf.com

    # Apex → www redirect. Runs before the proxy rules below so a request that
    # arrived on the apex name never reaches the backend directly.
    RewriteEngine On
    RewriteCond %{HTTP_HOST} !^www\.opencircuitsf\.com$ [NC]
    RewriteRule ^ https://www.opencircuitsf.com%{REQUEST_URI} [L,R=301]

    # ---- statically served /.well-known/ --------------------------------
    # MUST precede every ProxyPass below: Apache evaluates them top-to-bottom,
    # so the wildcard `ProxyPass /` would otherwise swallow this prefix.
    #
    # /.well-known/atproto-did holds the domain's Bluesky DID and is served
    # from disk. This is not optional tidiness — the Go service has no
    # /.well-known/ route and answers 404 there, so proxying this prefix takes
    # Bluesky handle verification offline. Serving it from disk also means a
    # redeploy, a crash, or a stopped opencircuit.service cannot break it.
    #
    # The path below is the DocumentRoot the static placeholder used on the
    # real box; confirm it before installing this file anywhere else.
    ProxyPass /.well-known/ !
    Alias /.well-known/ /var/www/vhosts/www.opencircuitsf.com/.well-known/
    <Directory "/var/www/vhosts/www.opencircuitsf.com/.well-known">
        AllowOverride None
        Options -Indexes +FollowSymLinks
        Require all granted
    </Directory>

    ProxyPreserveHost On

    # TLS terminates here; the app only speaks plain HTTP, so tell it what
    # scheme the browser actually used.
    RequestHeader set X-Forwarded-Proto "https"

    # SSE requires response buffering disabled so events flush immediately
    ProxyPass /api/events http://127.0.0.1:8080/api/events flushpackets=on
    ProxyPassReverse /api/events http://127.0.0.1:8080/api/events

    ProxyPass / http://127.0.0.1:8080/
    ProxyPassReverse / http://127.0.0.1:8080/

    # Security headers (#0064, PRD §11 / CLAUDE.md §11 security table).
    # mod_headers ships with AL2023's httpd package and is loaded by default
    # via conf.modules.d/ — if `Header` directives are silently ignored,
    # confirm with `httpd -M | grep headers_module` and add
    # `LoadModule headers_module modules/mod_headers.so` if it's missing.
    #
    # `always` applies the header to error responses too (4xx/5xx), not just
    # 2xx — matters here because a misconfigured backend could otherwise
    # serve an unprotected error page.
    # NOTE — the deployed vhost does NOT currently match this line. The live
    # box runs `max-age=300` with no includeSubDomains, a deliberate short ramp
    # for the first deploy (HANDOFF.md §5.3): includeSubDomains pins every
    # *.opencircuitsf.com host — go., lists., any future one — to HTTPS in
    # every browser that has seen the header, for a year, with no faster way
    # to unwind it. Raise the live value to this one once the site has been
    # healthy for a while.
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # Content-Security-Policy — no `unsafe-inline` for scripts. Vite bundles
    # web/src/main.ts into hashed, same-origin assets, so script-src can be
    # locked to 'self' plus one hash for the single inline bootstrap script
    # in web/index.html (the pre-paint theme-flash guard). See
    # docs/deployment.md's "Security headers" section for exactly how that
    # hash was computed. It IS now proven against a real `npm run build`
    # output: recomputed from web/dist/index.html with Python's html.parser
    # (not a regex — CLAUDE.md §8 records regex getting this wrong twice by
    # matching the literal script tag inside an HTML comment) and re-verified
    # against the bytes Apache actually serves. The live page has exactly two
    # <script> elements: this inline one, and the external module bundle.
    #
    # style-src keeps 'unsafe-inline': the SPA's Svelte components use plain
    # `style="..."` HTML attributes in several places (e.g. Logo.svelte's
    # per-instance CSS custom properties), which CSP's style-src also
    # governs. Locking that down too would need a source refactor away from
    # inline style attributes — out of scope here; see docs/deployment.md.
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-KLoCdoLOAQC6Tl5qFMi7s/7fwSxANUdbZFjnX7Vhau8='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'; object-src 'none'"

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/opencircuitsf.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/opencircuitsf.com/privkey.pem
</VirtualHost>
