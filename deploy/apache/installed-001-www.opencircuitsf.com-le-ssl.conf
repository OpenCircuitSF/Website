<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName www.opencircuitsf.com

    # www is canonical (CLAUDE.md §7, PRD §10.2). The apex and every other
    # *.opencircuitsf.com name is redirected here by
    # 002-opencircuitsf.com-le-ssl.conf, which sorts AFTER this file — so this
    # vhost only ever sees requests that already arrived on www, and needs no
    # redirect of its own.

    # ---- statically served /.well-known/ -----------------------------------
    # MUST stay ahead of the ProxyPass rules below; Apache evaluates them
    # top-to-bottom and the wildcard `ProxyPass /` would otherwise swallow this.
    #
    # /.well-known/atproto-did holds this domain's Bluesky DID
    # (did:plc:olbggqhj2rwqv56ik53kvwfx) and is served from disk, exactly as it
    # was under the static placeholder that occupied this vhost until
    # 2026-08-25. It deliberately does NOT go to the Go service: the app has no
    # /.well-known/ route and answers 404 there, so proxying this prefix would
    # break Bluesky handle verification the moment the service came up. Keeping
    # it on disk also means a redeploy, a crash, or a stopped opencircuit.service
    # cannot take the DID offline.
    #
    # `ProxyPass ... !` is the exclusion; Alias is what actually serves it.
    ProxyPass /.well-known/ !
    Alias /.well-known/ /var/www/vhosts/www.opencircuitsf.com/.well-known/
    <Directory "/var/www/vhosts/www.opencircuitsf.com/.well-known">
        AllowOverride None
        Options -Indexes +FollowSymLinks
        Require all granted
    </Directory>

    # ---- /prototypes/ : static, straight out of the repo checkout ----------
    # Same shape as the /.well-known/ exception above, and for the same reason:
    # the Go service has no /prototypes route, so without the `!` exclusion the
    # wildcard ProxyPass below hands these URLs to the SPA and every one of them
    # renders the 404 view. Must stay ahead of that ProxyPass.
    #
    # The source is the tracked prototypes/ directory inside /opt/opencircuit,
    # NOT a separate copy. That is deliberate: `git pull` during a deploy
    # updates what is served here, with nothing to sync by hand and no way for
    # the served copy to drift from the committed one.
    #
    # Indexes are ON for this prefix. prototypes/ has no index.html of its own,
    # and browsing is the point of the directory -- see its README. Everything
    # in it is already public in the GitHub repo, so the listing discloses
    # nothing new.
    ProxyPass /prototypes !
    Alias /prototypes/ /opt/opencircuit/prototypes/
    Alias /prototypes  /opt/opencircuit/prototypes
    <Directory "/opt/opencircuit/prototypes">
        AllowOverride None
        Options +Indexes +FollowSymLinks
        Require all granted

        # The site-wide CSP further down locks script-src to 'self' plus one
        # hash for the SPA's bootstrap script. A prototype is a standalone page
        # built out of its own inline <script> and <style> blocks, so that
        # policy would load the page and then silently refuse to run it -- the
        # failure looks like a broken prototype, not a header problem.
        #
        # Relax it for this prefix only. Still same-origin for everything
        # fetchable (the pages self-host their fonts and images); the change is
        # limited to permitting the inline blocks the pages are made of.
        # `Header always set` in a <Directory> replaces the vhost-level value
        # for these requests rather than adding a second header.
        Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'; object-src 'none'"
    </Directory>

    # ---- /media/ : operator-uploaded images, on disk -----------------------
    # Third and last ProxyPass exclusion, same shape as the two above and for
    # the same reason: the Go service has no /media route, so without the `!`
    # every URL here would render the SPA's 404 view.
    #
    # This is where workshop cover images live. workshops.cover_image is a plain
    # same-site path validated by isSafeCoverImage (must start with a single
    # `/`), and #0051's API has no upload endpoint -- the admin editor's cover
    # image field is a text box. So the workflow is: scp a file into
    # /var/www/media, then type /media/<name> into that field.
    #
    # Deliberately NOT under /assets/. That prefix belongs to Vite's hashed
    # build output, which is compiled into the binary by //go:embed -- excluding
    # /assets/ from the proxy would cut the SPA off from its own JS and CSS.
    #
    # On disk rather than in web/public/ so adding a photo does not mean a
    # rebuild, a redeploy, and a permanently larger binary. The tradeoff is that
    # these files are NOT in git: they live only on this instance, so they
    # belong in whatever backs up the box.
    #
    # Indexes are OFF here, unlike /prototypes/. A directory listing of
    # everything ever uploaded is not something to publish by accident, and
    # nothing needs to browse it -- each image is referenced by exact path.
    ProxyPass /media !
    Alias /media/ /var/www/media/
    Alias /media  /var/www/media
    <Directory "/var/www/media">
        AllowOverride None
        Options -Indexes -ExecCGI +FollowSymLinks
        Require all granted

        # Static, content-addressed-by-name media: cache hard. Renaming is how
        # you bust it, which is why cover_image stores an exact path.
        Header always set Cache-Control "public, max-age=604800"

        # Never let anything served from here be interpreted as active content,
        # whatever its extension or sniffed type. This directory takes operator
        # uploads, so it is the one place on the site where a stray .html or
        # .svg could otherwise run script in the site's own origin.
        Header always set Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; sandbox"
        Header always set X-Content-Type-Options "nosniff"
    </Directory>

    # ---- reverse proxy to the Go service -----------------------------------
    # opencircuit.service listens on 127.0.0.1:8080 (see
    # /etc/systemd/system/opencircuit.service and /etc/opencircuit/config.env).
    # 8081 and 8083 are the two ShortLinks instances, 8082 is prototypes —
    # nothing here may touch those.
    ProxyPreserveHost On

    # TLS terminates here; the app only ever speaks plain HTTP, so tell it what
    # scheme the browser actually used.
    RequestHeader set X-Forwarded-Proto "https"

    # SSE needs response buffering off so events flush immediately. Must precede
    # the wildcard ProxyPass, same top-to-bottom rule as the exclusion above.
    ProxyPass /api/events http://127.0.0.1:8080/api/events flushpackets=on
    ProxyPassReverse /api/events http://127.0.0.1:8080/api/events

    ProxyPass / http://127.0.0.1:8080/
    ProxyPassReverse / http://127.0.0.1:8080/

    # ---- security headers (#0064, PRD §11) ---------------------------------
    # `always` so these also cover 4xx/5xx, not just 2xx.
    #
    # HSTS is deliberately on a SHORT ramp for this first deploy: max-age=300,
    # no includeSubDomains. The repo's deploy/apache/opencircuitsf.com.conf
    # specifies max-age=31536000; includeSubDomains, which pins every
    # *.opencircuitsf.com host (go., lists., any future one) to HTTPS in every
    # browser that has seen this response, for a year, with no way to unwind it
    # faster than that. Raise it once the site has been healthy for a while —
    # HANDOFF.md §5.3's ramp.
    Header always set Strict-Transport-Security "max-age=300"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # script-src carries one sha256 for the single inline bootstrap script in
    # web/index.html (the pre-paint theme-flash guard). That hash was verified
    # against a real `npm run build` output on 2026-08-25 by parsing
    # web/dist/index.html with Python's html.parser — NOT by regex, which
    # CLAUDE.md §8 records getting this wrong twice by matching the literal
    # "<script>" text inside an HTML comment on line 38. The parser found
    # exactly two <script> elements: this inline one, and the external
    # /assets/index-*.js module. Recompute it the same way if
    # web/index.html's inline script ever changes.
    #
    # style-src keeps 'unsafe-inline': several Svelte components set per-instance
    # CSS custom properties via plain style="..." attributes (Logo.svelte among
    # them), which style-src also governs. Removing it needs a source refactor.
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-KLoCdoLOAQC6Tl5qFMi7s/7fwSxANUdbZFjnX7Vhau8='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'; object-src 'none'"

    ErrorLog "logs/opencircuitsf_error_log"
    CustomLog "logs/opencircuitsf_access_log" combined

    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile /etc/letsencrypt/live/opencircuitsf.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/opencircuitsf.com/privkey.pem
</VirtualHost>
</IfModule>
